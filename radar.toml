# Company tech radar: OWNED BY THE IT DEPARTMENT. Change it by pull request.
#
# ring:     adopt | trial | assess | hold
# category: the capability a technology fills; the design compiler picks one per capability
# match:    names that detect the tech in manifests (pyproject, package.json, requirements),
#           imports, Docker images and design docs (case-insensitive, normalized)
# What each ring allows per maturity (pov/poc/mvp/prod) is fixed in src/factory/radar.py.

company = "Example Corp"
version = "2026.10"

