# Factory definition: the one file that says how this factory ships.
# Paths are relative to this file.

[factory]
name = "AI Software Factory"
radar = "radar.toml"              # maintained by the IT department
work_dir = "work"                 # one folder per work item (idea -> spec -> design -> tasks)
apps_dir = "apps"                 # the shipped applications
golden_paths_dir = "golden_paths" # IT-approved project templates

[agent]
runner = "offline"                # offline (templates, free) | claude (Claude Code CLI, billed)
max_turns_build = 40
judge = false                     # LLM-as-judge on spec/plan/build (advisory, billed, agent runners only)
# judge_thinking_tokens: unset = model default. Measured on one real spec (haiku): default thinking ~$0.08 and
# caught invented requirements; budget 3000 ~$0.05; budget 0 ~$0.02 but MISSED them (fidelity 5). Cheap judging
# is a false economy, so leave it unset unless you re-run the calibration (`just calibrate`, billed).
max_build_attempts = 3           # build -> gate loops per `run` before a human is asked (agent runners only)

[agent.models]                    # passed to `claude --model` (aliases accepted)
spec = "sonnet"
plan = "sonnet"
build = "sonnet"
judge = "haiku"                   # a different, cheaper model than the generators (no self-grading)

[policy]
# An IT exception is a debt, not a permanent right: the ones granted when IT approves a design review lapse
# after this many days (`factory allow --expires` sets its own date). 0 = they never lapse.
exception_days = 180

[engine]
# Claudo checkout used to validate (and later execute) plans. Empty = auto-discover: $CLAUDO_HOME, then a
# sibling ../AI-Workflow-gates/_build or ../Claudo. With no engine found the factory still runs, unlinted.
claudo = ""
plan_lint_retries = 2             # re-prompt the planner this many times with Claudo's plan-lint errors
# Lowest maturity built task-by-task through Claudo (pov|poc|mvp|prod). Measured on a two-endpoint app: one
# Claudo task cost $3.29 / 11 min against $0.71 / 3 min for a whole app on the single-agent path, so the
# auditable path engages where audit earns its price. POV/POC use the single agent (gates still apply).
build_from = "mvp"
build_timeout = 3600             # seconds allowed per Claudo orchestrator run
budget_usd = 0                    # spend cap per orchestrator run (LAB_BUDGET_USD); 0 = no cap

# Gates per maturity rung. The higher the rung, the stricter the factory.
[gates]
# immutable  = spec.md / design.md are exactly what was approved (agents never edit the contract)
# trajectory = HOW a Claudo build went (journal + git scope), only for items built through Claudo
pov = ["radar", "secrets", "immutable"]
poc = ["radar", "secrets", "immutable", "tests"]
mvp = ["radar", "secrets", "immutable", "tests", "lint", "trajectory"]
prod = ["radar", "secrets", "immutable", "tests", "lint", "trajectory"]

# Shell commands for command-based gates, run inside the app folder.
[gates.commands]
tests = "uv run --quiet pytest -q"
lint = "uv run --quiet ruff check ."
