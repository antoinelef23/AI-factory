[project]
name = "ai-factory"
version = "0.1.0"
description = "AI software factory MVP: business ideas -> production-grade apps, governed by the company tech radar"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: calls a paid model; opt-in with --live (just calibrate)"]

[tool.coverage.run]
branch = true
source = ["src/factory", "scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 110
extend-exclude = ["golden_paths", "apps", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
