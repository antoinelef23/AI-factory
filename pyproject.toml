[project]
name = "ai-factory"
version = "0.1.0"
description = "AI software factory MVP: business ideas -> production-grade apps, governed by the company tech radar"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: calls a paid model; opt-in with --live (just calibrate)"]

[tool.ruff]
line-length = 110
extend-exclude = ["golden_paths", "apps", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
